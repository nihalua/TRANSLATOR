name: Build Windows exe

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt pyinstaller

      - name: Run tests
        run: python -m pytest -q

      - name: Build exes
        run: |
          pyinstaller --onefile --windowed --name TRANSLATOR --icon icons/translator.ico --add-data "icons/translator.ico;icons" run_translator.py
          pyinstaller --onefile --windowed --name CHECKER --icon icons/checker.ico --add-data "icons/checker.ico;icons" run_checker.py

      - uses: actions/upload-artifact@v4
        with:
          name: TRANSLATOR-windows
          path: |
            dist/TRANSLATOR.exe
            dist/CHECKER.exe
